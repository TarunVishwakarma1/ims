services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "ims"
      POSTGRES_PASSWORD: "yourpassword"
      POSTGRES_DB: "ims_db"
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
      - ./backend/.env.local
    environment:
      LOG_FILE_PATH: /var/log/backend/backend.log
    ports:
      - 8080:8080
    volumes:
      - ./backend/logs:/var/log/backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080/api"
    ports:
      - 3000:3000
    env_file:
      - ./web/.env.docker
    depends_on:
      backend:
        condition: service_started

  web-shop:
    build:
      context: ./web-shop
      dockerfile: Dockerfile
      args:
        BACKEND_URL: "http://backend:8080"
        # Dev seed uses picsum.photos placeholders; allowlist for next/image.
        SHOP_IMAGE_HOSTS: "picsum.photos"
    ports:
      - 3001:3001
    environment:
      # Served on http://localhost:3001 — a Secure cookie would be dropped by
      # the browser over http, breaking login + all authed /api/shop calls.
      # Set to "true" only when serving the shop over https.
      COOKIE_SECURE: "false"
    env_file:
      - path: ./web-shop/.env.docker
        required: false
    depends_on:
      backend:
        condition: service_started

  # ngrok tunnel — exposes backend:8080 to the public internet so
  # third-party webhooks (RazorPay, etc) can reach our dev box.
  # Inspection UI: http://localhost:4040
  # Public tunnel URL: visible at http://localhost:4040/api/tunnels
  #
  # Optional. Disabled by default — start with:
  #   docker compose --profile webhooks up
  ngrok:
    image: ngrok/ngrok:alpine
    profiles: ["webhooks"]
    command: ["http", "backend:8080", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env or shell}
    ports:
      - 4040:4040
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:

networks:
  default:
    name: ims_net

  
    