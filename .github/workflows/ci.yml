name: CI
on:
  push:
    branches: [develop, testing, feature/*, bugfix/*, hotfix/*]
  pull_request:
    branches: [main, develop]
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Run Build
        run: go build -o /dev/null -v ./...
      - name: Run tests
        run: go test -v ./...
      
