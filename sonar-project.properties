sonar.projectKey=ims-monorepo
sonar.projectName=Inventory Management System
sonar.sourceEncoding=UTF-8

# Provide comma-separated paths to source directories
sonar.sources=backend,web,web-shop,android,ios
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**,**/build/**,**/.gradle/**,**/ios/Pods/**,**/ios/ims.xcodeproj/**

# Provide paths to test directories
sonar.tests=backend,web,web-shop,android,ios
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*Test.kt,**/*Tests.swift

# Go settings
sonar.go.coverage.reportPaths=reports/backend-coverage.out
sonar.go.golangci-lint.reportPaths=reports/backend-lint.xml
sonar.go.gosec.reportPaths=reports/backend-sec.json

# Web & Web-Shop settings
sonar.eslint.reportPaths=reports/web-lint.json,reports/web-shop-lint.json
