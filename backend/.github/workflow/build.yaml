name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Check out repository
      uses: actions/checkout@v4

    # Step 2: Set up Go environment (optional, but good if you run tests first)
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Specify your Go version

    # Step 3: Run Go tests (Recommended before building the image)
    - name: Run Tests
      run: go test -v ./...

    # Step 4: Set up Docker Buildx (enables advanced build features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 5: Log in to Docker Hub (or GHCR / AWS ECR)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 6: Generate Docker Metadata (tags and labels)
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/my-go-app
        tags: |
          # Dynamic version tag: e.g., sha-a1b2c3d or v1.0.0-build.1
          type=sha,format=short,prefix=v-
          # The 'latest' tag that always updates to the newest build
          type=raw,value=latest

    # Step 7: Build and Push the Docker Image
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}